<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Shorts Blocker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <h1>Shorts Blocker</h1>
    <label class="row" for="toggle">
      <span>Block Shorts</span>
      <input type="checkbox" id="toggle" checked />
    </label>
    <p id="status" class="status">Enabled</p>
    <p class="hint">Hides Shorts shelves, sidebar, search chips, and blocks /shorts/ navigation. Reload YouTube after toggling for a clean state.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
